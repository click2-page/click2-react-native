name: Release

# Tag vX.Y.Z -> tests -> npm publish (trusted publishing, with provenance) -> GitHub Release.
# Before tagging: set "version" in package.json and the SDK header in src/index.ts, and move the CHANGELOG entries
# under the new version. npm trusted publishing must be set up for this repo and workflow (npmjs.com → package
# settings → Trusted publishing); no npm token is stored here.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Check the version matches the tag
        run: |
          V="${GITHUB_REF_NAME#v}"
          [ "$(node -p 'require("./package.json").version')" = "$V" ] || { echo "package.json version is not $V"; exit 1; }
          grep -q "react-native/${V}\`" src/index.ts || { echo "the x-click2-sdk header in src/index.ts is not $V"; exit 1; }
          grep -q "^## \[${V}\]" CHANGELOG.md || { echo "CHANGELOG.md has no ${V} section"; exit 1; }
      - run: npm ci
      # Pinned: trusted publishing needs npm 11.5.1 or later; bump deliberately.
      - run: npm install -g npm@11.6.2
      - name: Publish to npm (skipped when this version is already there, e.g. published by hand)
        run: |
          if npm view "@click2/react-native@${GITHUB_REF_NAME#v}" version >/dev/null 2>&1; then
            echo "already on npm"
          else
            npm publish --access public --provenance
          fi
      - name: Release notes from the changelog
        run: awk -v v="${GITHUB_REF_NAME#v}" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^(## )?\[/ {f=0} f' CHANGELOG.md > notes.md
      - uses: softprops/action-gh-release@v3
        with:
          body_path: notes.md
